services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${PG_DB_NAME}
      POSTGRES_USER: ${PG_DB_USER}
      POSTGRES_PASSWORD: ${PG_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_DB_USER} -d ${PG_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.9.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094

      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9093 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --create --if-not-exists \
          --topic solitud.funnel.events \
          --bootstrap-server kafka:9093 \
          --partitions 6 \
          --replication-factor 1

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      BACKEND_APP_MODULE: services.api.main:app
      PORT: 8000
      RUN_MIGRATIONS: "1"
      UVICORN_RELOAD: "1"
      SOLITUD_KAFKA_ENABLED: "true"
      SOLITUD_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SOLITUD_KAFKA_GENERATE_FE_TOPIC: solitud.funnel.events
      SOLITUD_KAFKA_GENERATE_FE_GROUP_ID: solitud-generate-fe
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/docs')"]
      interval: 5s
      timeout: 3s
      retries: 20

  ws:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      BACKEND_APP_MODULE: services.ws.main:asgi_app
      PORT: 8001
      RUN_MIGRATIONS: "0"
      UVICORN_RELOAD: "0"
      SOLITUD_KAFKA_ENABLED: "true"
      SOLITUD_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SOLITUD_KAFKA_GENERATE_FE_TOPIC: solitud.funnel.events
      SOLITUD_KAFKA_GENERATE_FE_GROUP_ID: solitud-generate-fe
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  generate-fe-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      SOLITUD_KAFKA_ENABLED: "true"
      SOLITUD_KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      SOLITUD_KAFKA_GENERATE_FE_TOPIC: solitud.funnel.events
      SOLITUD_KAFKA_GENERATE_FE_GROUP_ID: solitud-generate-fe
      SOLITUD_KAFKA_AUTO_OFFSET_RESET: earliest
      SOLITUD_KAFKA_POLL_TIMEOUT_SECONDS: 1.0
      WORKDIR: FE_Workbench
    entrypoint: [ "/bin/sh", "-ec" ]
    command: python -u -m generator.fe.generate_fe
    volumes:
      - .:/app
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  generate-fe-watcher:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      WORKDIR: FE_Workbench
      SOLITUD_SOCKET_SERVER_INTERNAL_HOST: http://ws:8001
    entrypoint: [ "/bin/sh", "-ec" ]
    command: python -u -m generator.fe.generate_fe_step_3
    volumes:
      - .:/app
    depends_on:
      ws:
        condition: service_started
    restart: unless-stopped
volumes:
  postgres_data:
  kafka_data:
